aid: newstore
name: Newstore
description: >-
  NewStore is a mobile-first omnichannel order management system (OMS) and
  point-of-service platform for retail brands. Its cloud platform unifies order
  management, mobile POS and checkout, clienteling, inventory and availability,
  fulfillment and order routing, returns, tax, fiscalization, and store
  operations into a single system, exposed through the NewStore Omnichannel
  REST API. The public API covers carts and checkout, customer profiles, orders
  and sales orders, in-store pickup and shipments, stock and reservations,
  fulfillment routing, catalog/pricebook/product export, identity and access
  management (users, roles, providers), and tenant/store configuration.
  Integrations are delivered through a documented webhook/adapter surface
  (payment, tax, shipping, fulfillment, gift card, availability, and an event
  stream). Authentication is OAuth 2.0 client-credentials against a per-tenant
  Keycloak identity server. NewStore was founded by Stephan Schambach.
