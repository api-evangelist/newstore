summary: >-
  No official first-party NewStore API client SDK was found on the public
  registries (npm, PyPI, Maven Central, NuGet, RubyGems, crates.io) or in the
  NewStore GitHub org as of 2026-07. The public GitHub org (github.com/NewStore)
  is mostly forks/mirrors plus a few app-specific repos (loyalty webviews, a
  commercetools connector, tenant-config automation), not a general API SDK.
  The developer portal (APIMatic) generates per-language HTTP code samples
  (curl and others) rather than shipping a published SDK.
