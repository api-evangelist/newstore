          description: Succesfully returning list of shipments limits
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShipmentLimitsResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ShipmentLimitsResponse'
        '429':
          description: Too Many Requests
          headers:
            Retry-After:
              schema:
