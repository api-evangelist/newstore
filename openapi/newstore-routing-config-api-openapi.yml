          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: Bad Gateway
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - oauth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ShipmentLimitsRequest'
        required: true
components:
  schemas:
    Problem:
      title: Problem
      type: object
      properties:
        detail:
          description: A human readable explanation specific to this occurrence of the problem that is helpful to locate the problem and give advice on how to proceed. Written in English and readable for engineers, usually not suited for non technical stakeholders and not localized.
          example: some description for the error situation
          type: string
        error_code:
          type: string
        instance:
          description: A URI reference that identifies the specific occurrence of the problem, e.g. by adding a fragment identifier or sub-path to the problem type. May be used to locate the root of this problem in the source code.
          example: /some/uri-reference#specific-occurrence-context
          type: string
        message:
          type: string
        messages:
          type: array
          items:
            type: string
        request_id:
          type: string
        status:
          description: The HTTP status code generated by the origin server for this occurrence of the problem.
          type: integer
          minimum: 100.0
          format: int32
          exclusiveMaximum: 600.0
        title:
          description: A short summary of the problem type. Written in English and readable for engineers, usually not suited for non technical stakeholders and not localized.
          example: some title for the error situation
          type: string
        type:
          description: A URI reference that uniquely identifies the problem type only in the context of the provided API. Opposed to the specification in RFC-7807, it is neither recommended to be dereferenceable and point to a human-readable documentation nor globally unique for the problem type.
          example: /some/uri-reference
          type: string
          default: about:blank
    RejectedReroutingSettings:
      title: RejectedReroutingSettings
      type: object
      properties:
        updated_at:
          readOnly: true
          type: string
          format: date-time
        value:
          description: Tells the routing engine if it should ignore fulfillment nodes that already rejected the fulfillment request at hand.
          type: boolean
      required:
      - value
    ShippingOfferUpdateSettings:
      title: ShippingOfferUpdateSettings
      type: object
      properties:
        updated_at:
          readOnly: true
          type: string
          format: date-time
        value:
          description: Determines whether an order routed to a DC needs a shipping offer update.
          type: boolean
      required:
      - value
    ExternalFulfillmentSettingsResponse:
      title: ExternalFulfillmentSettingsResponse
      description: Current external-fulfillment configuration setting.
      type: object
      properties:
        updated_at:
          description: Contains date-time in ISO8601 UTC format when config was updated at least once. Value can be null if config value has not been specified yet by the retailer.
          type: string
        value:
          description: Tenant-based release toggle for updating the status of a fulfillment request in NOM.
          type: boolean
      required:
      - updated_at
      - value
    AutomaticReroutingSettings:
      title: AutomaticReroutingSettings
      type: object
      properties:
        updated_at:
          readOnly: true
          type: string
          format: date-time
        value:
          description: Tenant-based release toggle for the automatic rerouting feature in order to roll it out on a per tenant basis.
          type: boolean
      required:
      - value
    LimitExceededWhen:
      title: LimitExceededWhen
      type: object
      properties:
        order_amount_lt:
          description: AND order amount less than
          type: number
          minimum: 0.0
          format: double
        shipment_count_gt:
          description: 'AAAAACondition: number of shipments greater than'
          type: integer
          minimum: 0.0
          format: int64
      required:
      - order_amount_lt
      - shipment_count_gt
    ExternalFulfillmentSettingsRequest:
      title: ExternalFulfillmentSettingsRequest
      description: Payload for setting external-fulfillment configuration.
      type: object
      properties:
        value:
          description: Tenant-based release toggle for updating the status of a fulfillment request in NOM.
          type: boolean
      required:
      - value
    CancellationPolicySettings:
      title: CancellationPolicySettings
      type: object
      properties:
        updated_at:
          readOnly: true
          type: string
          format: date-time
        value:
          type: object
          allOf:
          - $ref: '#/components/schemas/CancellationPolicySettingsValue'
          - description: Order cancellation policies.
      required:
      - value
    ShipmentLimitsRequest:
      title: ShipmentLimitsRequest
      description: Limit shipment rules for given currency x service level
      type: object
      properties:
        currency:
          description: Currency alpha code in ISO 4217 format. Per example USD, EUR or JPY
          type: string
          minLength: 3
          maxLength: 3
        limit_exceeded_when:
          type: array
          items:
            $ref: '#/components/schemas/LimitExceededWhen'
        service_level:
          description: Shipping service level
          type: string
      required:
      - currency
      - limit_exceeded_when
      - service_level
    CancellationPolicySettingsReasons:
      title: CancellationPolicySettingsReasons
      type: string
      enum:
      - insufficient_stock
      - failed_fulfillment_node_mapping
      - shipping_offer_update_error
      - error
      - not_enough_stock_to_create_allocation
      - limit_of_shipments_exceeded
    CapacityBasedRoutingSettings:
      title: CapacityBasedRoutingSettings
      type: object
      properties:
        updated_at:
          readOnly: true
          type: string
          format: date-time
        value:
          description: Tenant-based release toggle for the feature of capacity-based routing.
          type: boolean
      required:
      - value
    ShipmentLimitsResponse:
      title: ShipmentLimitsResponse
      description: List of all shipments limit rules
      type: object
      properties:
        shipments_limit:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentLimitsRequest'
      required:
      - shipments_limit
    ExternalAtpSettings:
      title: ExternalAtpSettings
      type: object
      properties:
        updated_at:
          readOnly: true
          type: string
          format: date-time
        value:
          description: If true, use availability service to request ATP data; otherwise use unallocated items count.
          type: boolean
      required:
      - value
    CancellationPolicySettingsValue:
      title: CancellationPolicySettingsValue
      description: Order cancellation policies.
      type: object
      properties:
        default:
          description: Determines whether orders are canceled automatically in case of a conflict.
          type: boolean
          default: true
        reasons_to_overwrite_default:
          description: A list of reasons to prevent an automatic cancelation of an order (in case default is 'true') or to prevent an order being in the conflict state.
          type: array
          items:
            $ref: '#/components/schemas/CancellationPolicySettingsReasons'
          minItems: 1
  securitySchemes:
    oauth:
      type: oauth2
      flows:
        clientCredentials:
          scopes:
            catalog:import-schemas:read: Grants privileges to read import schema
            catalog:import-schemas:write: Grants privileges to write import schema
            catalog:pricebook-export:read: Grants privileges to export pricebook data
            catalog:product-export:read: Grants privileges to export product data
            checkout:carts:read: Grants privileges to read cart data
            checkout:carts:write: Grants privileges to write cart data
            clienteling:profile:read: Grants privileges to read clienteling profiles
            customer:profile:read: Grants privileges to read API customer data
            customer:profile:write: Grants privileges to modify API customer data
            newstore:configuration:read: Grants privileges to read configuration
            newstore:configuration:write: Grants privileges to write configuration
            fiscalization:orders:read: View orders with fiscal transactions and signatures
            fiscalization:orders:write: Create orders with fiscal transactions and signatures
            shipments:read: Read Shipping Options and Audits
            iam:providers:read: ' Grants read privileges to provider resources'
            iam:providers:write: ' Grants write privileges to provider resources'
            iam:roles:read: ' Grants privileges to read roles data'
            iam:roles:write: ' Grants privileges to write roles data'
            iam:users:read: ' Grants privileges to read user data'
            iam:users:write: ' Grants privileges to write user data'
            inventory:reservations:read: Allows access to retrieve reservations
            inventory:reservations:write: Allows access to create and update reservations
            promotions:config:read: Grants privileges to read configuration
            promotions:config:write: Grants privileges to write into configuration
            promotions:reason-codes:read: Grants privileges to list reason codes
            promotions:reason-codes:write: Grants privileges to create and update reason codes
            audit-events:read: Grants read access to the tenant's audit events.
            taxes:preview-transactions:write: Preview tax transactions
            taxes:transactions:read: Read tax transactions
          tokenUrl: https://id.p.newstore.net/auth/realms/dodici-demo/protocol/openid-connect/token
