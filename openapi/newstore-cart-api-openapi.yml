  /checkout/carts/{cartId}/items/{lineItemId}/add-ons:
    post:
      description: Create an add-on for a line item on a cart
      summary: createAddOnLineItem
      tags:
      - cart
      operationId: createAddOnLineItem
      deprecated: false
      produces:
      - application/problem+json
      - application/json
      consumes:
      - application/json
      parameters:
      - name: cartId
        in: path
        required: true
        type: string
        description: Cart ID
      - name: lineItemId
        in: path
        required: true
        type: string
        description: Parent Line Item ID
      - name: Content-Type
        in: header
        required: false
        enum:
        - application/json
        type: string
        description: ''
      - name: body
        in: body
        required: true
        description: ''
        schema:
          $ref: '#/definitions/AddItemRequestBody'
      responses:
        default:
          description: Unexpected error not otherwise documented
          schema:
            $ref: '#/definitions/Problem'
          headers: {}
        '201':
          description: Created
          schema:
            $ref: '#/definitions/AddItemResponseBody'
          headers:
            Access-Control-Allow-Headers:
