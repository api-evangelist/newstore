openapi: 3.2.0
info:
  version: '1.0'
  title: NewStore Store Tax Configuration API
  description: NewStore public APIs
  contact:
    email: support@newstore.com
    name: NewStore API Support
    url: https://developer.newstore.com
servers:
- url: https://dodici-demo.p.newstore.net/
security: []
tags:
- name: store-tax-configuration
  description: Tax configuration - Store
paths:
  /taxes/config/stores:
    get:
      description: List store tax calculation configurations with the given query.
      summary: listStoreConfigs
      tags:
      - store-tax-configuration
      operationId: listStoreConfigs
      deprecated: false
      parameters:
      - name: limit
        in: query
        required: true
        description: Limit number of results to this value.
        schema:
          type: integer
          format: int32
          maximum: 100.0
          minimum: 1.0
      - name: tax_calculation_strategy
        in: query
        required: false
        description: Tax calculation strategy to filter by.
        schema:
          type: string
          enum:
          - fixedrate
          - fixed_rate_per_country
          - avalara
          - vertex
          - custom
      - name: next_page_key
        in: query
        required: false
        description: Key to be used to get the next page of results.
        schema:
          type: string
      responses:
        default:
          description: Unexpected error.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '200':
          description: List of tax configurations of stores.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/StoreConfigListDto'
            application/json:
              schema:
                $ref: '#/components/schemas/StoreConfigListDto'
        '400':
          description: Bad request.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too Many Requests
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: Bad Gateway
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - oauth:
        - newstore:configuration:read
    post:
      description: Create a tax calculation configuration for the specified store identifier.
      summary: createStoreConfig
      tags:
      - store-tax-configuration
      operationId: createStoreConfig
      deprecated: false
      parameters:
      - name: Content-Type
        in: header
        required: false
        description: ''
        schema:
          type: string
          enum:
          - application/json
      responses:
        default:
          description: Unexpected error.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '201':
          description: Tax configuration of the store.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/StoreConfigDto'
            application/json:
              schema:
                $ref: '#/components/schemas/StoreConfigDto'
        '400':
          description: Bad request.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Tax configuration for the given store was already created.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too Many Requests
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: Bad Gateway
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - oauth:
        - newstore:configuration:write
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreConfigCreateDto'
        required: true
  /taxes/config/stores/{id}:
    delete:
      description: Delete tax configuration for the given store identifier.
      summary: destroyStoreConfig
      tags:
      - store-tax-configuration
      operationId: destroyStoreConfig
      deprecated: false
      parameters:
      - name: id
        in: path
        required: true
        description: Store identifier.
        schema:
          type: string
      responses:
        default:
          description: Unexpected error.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '204':
          description: Tax configuration deleted for the given store identifier.
          headers: {}
        '401':
          description: Unauthorized.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Tax configuration not found.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too Many Requests
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: Bad Gateway
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - oauth:
        - newstore:configuration:write
    get:
      description: Get tax configuration for the given store identifier.
      summary: showStoreConfig
      tags:
      - store-tax-configuration
      operationId: showStoreConfig
      deprecated: false
      parameters:
      - name: id
        in: path
        required: true
        description: Store identifier.
        schema:
          type: string
      - name: version
        in: query
        required: false
        description: Specific configuration version number to fetch. If left empty, the latest version of the configuration will be returned.
        schema:
          type: integer
          format: int32
          minimum: 0.0
      - name: merged_tenant_fallback
        in: query
        required: false
        description: Flag that indicates if the store configuration should be merged with the tenant configuration to provide tenant level fallbacks to the store. This flag defaults to true if it is not sent.
        schema:
          type: boolean
          default: true
      responses:
        default:
          description: Unexpected error.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '200':
          description: 'Tax configuration of the store.

            * If the `merged_tenant_fallback` is set to `false`, the response will contain a store configuration `StoreConfigDto`.

            * If the `merged_tenant_fallback` is set to `true` or not sent, the response will contain a merged store configuration and tenant configuration `ConfigDto`.'
          headers: {}
          content:
            application/problem+json:
              schema: {}
            application/json:
              schema: {}
        '400':
          description: Bad request.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Tax configuration not found.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too Many Requests
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: Bad Gateway
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - oauth:
        - newstore:configuration:read
    patch:
      description: Partially update the tax configuration of a store by merging the given fields with the existing fields.
      summary: updateStoreConfig
      tags:
      - store-tax-configuration
      operationId: updateStoreConfig
      deprecated: false
      parameters:
      - name: id
        in: path
        required: true
        description: Store identifier.
        schema:
          type: string
      - name: Content-Type
        in: header
        required: false
        description: ''
        schema:
          type: string
          enum:
          - application/json
      responses:
        default:
          description: Unexpected error.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '200':
          description: Tax configuration of the store.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/StoreConfigDto'
            application/json:
              schema:
                $ref: '#/components/schemas/StoreConfigDto'
        '401':
          description: Unauthorized.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Tax configuration not found.
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too Many Requests
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: Bad Gateway
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - oauth:
        - newstore:configuration:write
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreConfigUpdateDto'
        required: true
components:
  schemas:
    ExemptionClassItemUpdateDto:
      title: ExemptionClassItemUpdateDto
      type: object
      properties:
        display_text:
          description: 'Display text to be used in Associate App while rendering the exemption class.

            * Required for custom tax exemption classes.

            * Optional for pre-defined tax exemption classes.

            * Keys must be a valid ISO 639-1 language code.

            * Must include English translation by default.'
          example:
            en: First Nation Citizen
            fr: Premières Nations
          type: object
          additionalProperties: {}
        exemption_class:
          $ref: '#/components/schemas/ExemptionClass'
        valid_countries:
          description: The list of countries where this tax exemption class is valid.
          type: array
          items:
            $ref: '#/components/schemas/TaxExemptionCountryCode'
      required:
      - exemption_class
      - valid_countries
    CustomV0AvalaraConfigUpdateDto:
      title: CustomV0AvalaraConfigUpdateDto
      type: object
      properties:
        account_number:
          description: AvaTax account number or account ID.
          example: '2000123456'
          type: string
          minLength: 1
          maxLength: 10
        company_code:
          description: 'Company code that identifies the company in the AvaTax account.

            * Value is case-sensitive.

            * Declared during the company setup in the AvaTax Admin Console.'
          example: NEWSTOREINC
          type: string
          minLength: 1
          maxLength: 25
        license_key:
          description: AvaTax license key.
          example: C1234567890ABCFE
          type: string
          minLength: 1
          maxLength: 16
          format: password
        url:
          description: Custom provider RESTful API URL that uses AvaTax v1 schema. Will be used for tax calculations.
          example: https://custom.provider.net/1.0/tax/get
          type: string
    VertexExemptionClassItemDto:
      title: VertexExemptionClassItemDto
      type: object
      properties:
        display_text:
          description: 'Display text to be used in Associate App while rendering the exemption class.

            * Required for custom tax exemption classes.

            * Optional for pre-defined tax exemption classes.

            * Keys must be a valid ISO 639-1 language code.

            * Must include English translation by default.'
          example:
            en: First Nation Citizen
            fr: Premières Nations
          type: object
          additionalProperties: {}
        exemption_class:
          $ref: '#/components/schemas/ExemptionClass'
        valid_countries:
          description: The list of countries where this tax exemption class is valid.
          type: array
          items:
            $ref: '#/components/schemas/TaxExemptionCountryCode'
        vertex_class_code:
          description: 'Vertex class code.

            * A code used to represent groups of customers, vendors, dispatchers, or recipients who have similar taxability.'
          example: '01'
          type: string
          minLength: 1
          maxLength: 20
      required:
      - exemption_class
      - valid_countries
      - vertex_class_code
    VertexAdministrativeOriginDto:
      title: VertexAdministrativeOriginDto
      type: object
      properties:
        city:
          description: The proper name of the city used to determine the Tax Area ID.
          example: Berlin
          type: string
          minLength: 1
          maxLength: 60
        country:
          type: string
        currency_code:
          $ref: '#/components/schemas/Currency3'
        currency_value:
          description: The rate (multiplier) used for converting the transaction currency amount to the filing currency amount.
          example: 1.1
          type: number
          format: double
        main_division:
          description: The proper name or the postal abbreviation of the state, province, or territory used to determine the Tax Area ID.
          example: Berlin
          type: string
          minLength: 1
          maxLength: 60
        postal_code:
          description: The postal code used to determine the Tax Area ID
          example: '10785'
          type: string
          minLength: 1
          maxLength: 20
        street_address_1:
          description: The first line of the street address.
          example: Potsdamer Str. 7
          type: string
          minLength: 1
          maxLength: 100
        street_address_2:
          description: The second line of the street address.
          example: Potsdamer Platz
          type: string
          minLength: 1
          maxLength: 100
      required:
      - city
      - country
      - currency_code
      - currency_value
      - main_division
      - postal_code
      - street_address_1
      - street_address_2
    VertexFlexibleFieldConfigUpdateDto:
      title: VertexFlexibleFieldConfigUpdateDto
      type: object
      properties:
        extended_attribute_name:
          description: The name of the extended attribute.
          example: shoeSize
          type: string
          minLength: 1
          maxLength: 255
        target_field_id:
          description: 'Vertex flexible field identifier.

            * If `target_field_type` is set to `flexible_code_field`, maximum length is 25.

            * If `target_field_type` is set to `flexible_numeric_field`, maximum length is 10.

            * If `target_field_type` is set to `flexible_date_field`, maximum length is 5.'
          example: 1
          type: integer
          minimum: 0.0
          maximum: 25.0
          format: int32
        target_field_type:
          $ref: '#/components/schemas/VertexTargetField'
    VertexFlexibleFieldConfigCreateDto:
      title: VertexFlexibleFieldConfigCreateDto
      type: object
      properties:
        extended_attribute_name:
          description: The name of the extended attribute.
          example: shoeSize
          type: string
          minLength: 1
          maxLength: 255
        target_field_id:
          description: 'Vertex flexible field identifier.

            * If `target_field_type` is set to `flexible_code_field`, maximum length is 25.

            * If `target_field_type` is set to `flexible_numeric_field`, maximum length is 10.

            * If `target_field_type` is set to `flexible_date_field`, maximum length is 5.'
          example: 1
          type: integer
          minimum: 0.0
          maximum: 25.0
          format: int32
        target_field_type:
          $ref: '#/components/schemas/VertexTargetField'
      required:
      - extended_attribute_name
      - target_field_id
      - target_field_type
    AvalaraConfigDto:
      title: AvalaraConfigDto
      type: object
      properties:
        account_number:
          description: AvaTax account number or account ID.
          example: '2000123456'
          type: string
          minLength: 1
          maxLength: 10
        company_code:
          description: 'Company code that identifies the company in the AvaTax account.

            * Value is case-sensitive.

            * Declared during the company setup in the AvaTax Admin Console.'
          example: NEWSTOREINC
          type: string
          minLength: 1
          maxLength: 25
        default_customer_code:
          description: Default customer code. Will be used in case when no ConsumerUUID is provided.
          example: Anonymous customer
          type: string
          minLength: 1
          maxLength: 50
        environment:
          $ref: '#/components/schemas/AvalaraEnv'
        exemption_classes:
          description: A list of mappings between `ExemptionClass` enum and Avalara custom entity use codes.
          type: array
          items:
            $ref: '#/components/schemas/AvalaraExemptionClassItemDto'
        license_key:
          description: AvaTax license key.
          example: C1234567890ABCFE
          type: string
          minLength: 1
          maxLength: 16
          format: password
      required:
      - account_number
      - company_code
      - environment
      - license_key
    FixedRateConfigCreateDto:
      title: FixedRateConfigCreateDto
      type: object
      properties:
        exemption_classes:
          description: A list of supported exemption classes.
          type: array
          items:
            $ref: '#/components/schemas/ExemptionClassItemCreateDto'
        tax_name:
          description: Tax name to be used in the tax lines.
          example: Standard VAT rate
          type: string
        tax_rate:
          description: 'Tax rate to be used as a fixed rate during tax calculations.

            * Allows up to 5 decimal points.'
          example: 0.19
          type: number
          format: double
      required:
      - tax_rate
    CustomV0AvalaraConfigCreateDto:
      title: CustomV0AvalaraConfigCreateDto
      type: object
      properties:
        account_number:
          description: AvaTax account number or account ID.
          example: '2000123456'
          type: string
          minLength: 1
          maxLength: 10
        company_code:
          description: 'Company code that identifies the company in the AvaTax account.

            * Value is case-sensitive.

            * Declared during the company setup in the AvaTax Admin Console.'
          example: NEWSTOREINC
          type: string
          minLength: 1
          maxLength: 25
        license_key:
          description: AvaTax license key.
          example: C1234567890ABCFE
          type: string
          minLength: 1
          maxLength: 16
          format: password
        url:
          description: Custom provider RESTful API URL that uses AvaTax v1 schema. Will be used for tax calculations.
          example: https://custom.provider.net/1.0/tax/get
          type: string
      required:
      - account_number
      - company_code
      - license_key
      - url
    VertexAdministrativeOriginCreateDto:
      title: VertexAdministrativeOriginCreateDto
      type: object
      properties:
        city:
          description: The proper name of the city used to determine the Tax Area ID.
          example: Berlin
          type: string
          minLength: 1
          maxLength: 60
        country:
          type: string
        currency_code:
          $ref: '#/components/schemas/Currency3'
        currency_value:
          description: The rate (multiplier) used for converting the transaction currency amount to the filing currency amount.
          example: 1.1
          type: number
          format: double
        main_division:
          description: The proper name or the postal abbreviation of the state, province, or territory used to determine the Tax Area ID.
          example: Berlin
          type: string
          minLength: 1
          maxLength: 60
        postal_code:
          description: The postal code used to determine the Tax Area ID
          example: '10785'
          type: string
          minLength: 1
          maxLength: 20
        street_address_1:
          description: The first line of the street address.
          example: Potsdamer Str. 7
          type: string
          minLength: 1
          maxLength: 100
        street_address_2:
          description: The second line of the street address.
          example: Potsdamer Platz
          type: string
          minLength: 1
          maxLength: 100
      required:
      - city
      - country
      - currency_code
      - currency_value
      - main_division
      - postal_code
      - street_address_1
      - street_address_2
    VertexExemptionClassItemUpdateDto:
      title: VertexExemptionClassItemUpdateDto
      type: object
      properties:
