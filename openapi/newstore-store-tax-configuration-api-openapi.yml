  CustomApiVersion:
    title: CustomApiVersion
    description: Custom provider API version.
    example: v1
    type: string
    enum:
    - v0-avalara
    - v1
  CustomConfigAuthenticationDto:
    title: CustomConfigAuthenticationDto
    type: object
    properties:
      method:
        $ref: '#/definitions/CustomConfigAuthenticationMethod'
      password:
        description: Custom provider Basic authentication password.
        example: secret-password
        type: string
      username:
        description: Custom provider Basic authentication username.
        example: username
        type: string
    required:
    - method
    - password
    - username
  CustomConfigDto:
    title: CustomConfigDto
    type: object
    properties:
      additional_config:
        type: object
        allOf:
        - $ref: '#/definitions/CustomConfigAdditionalDto'
        - description: Other necessary configuration specific to the custom provider (currently configs for non-officially supported avalara based custom implementation)
      api_version:
        $ref: '#/definitions/CustomApiVersion'
      authentication:
        type: object
        allOf:
        - $ref: '#/definitions/CustomConfigAuthenticationDto'
        - description: 'Custom provider API authentication method.

            * Currently, only Basic authentication is supported.

            * If the tax calculation strategy is set to `custom` and `api_version` is set to `v1`, the given configuration will be used.'
          example:
            method: Basic
            password: pass
            username: user
      base_url:
        description: 'The base URL for the custom taxes RESTful API. The value should include the route prefix to the quotation API.

          * Required if the `api_version` is set to `v1`.

          * If the tax calculation strategy is set to `custom` and `api_version` is set to `v1`, the given configuration will be used.'
        example: https://my.custom.domain/base_path
        type: string
      exemption_classes:
        description: A list of supported exemption classes.
        type: array
        items:
          $ref: '#/definitions/ExemptionClassItemDto'
    required:
    - api_version
  Problem:
    title: Problem
    type: object
    properties:
      detail:
        description: A human readable explanation specific to this occurrence of the problem that is helpful to locate the problem and give advice on how to proceed. Written in English and readable for engineers, usually not suited for non technical stakeholders and not localized.
        example: some description for the error situation
        type: string
      error_code:
        type: string
      instance:
        description: A URI reference that identifies the specific occurrence of the problem, e.g. by adding a fragment identifier or sub-path to the problem type. May be used to locate the root of this problem in the source code.
        example: /some/uri-reference#specific-occurrence-context
        type: string
      message:
        type: string
      messages:
        type: array
        items:
          type: string
      request_id:
        type: string
      status:
        description: The HTTP status code generated by the origin server for this occurrence of the problem.
        type: integer
        minimum: 100.0
        maximum: 600.0
        exclusiveMaximum: true
        format: int32
      title:
        description: A short summary of the problem type. Written in English and readable for engineers, usually not suited for non technical stakeholders and not localized.
        example: some title for the error situation
        type: string
      type:
        description: A URI reference that uniquely identifies the problem type only in the context of the provided API. Opposed to the specification in RFC-7807, it is neither recommended to be dereferenceable and point to a human-readable documentation nor globally unique for the problem type.
        example: /some/uri-reference
        type: string
        default: about:blank
  CustomConfigUpdateDto:
    title: CustomConfigUpdateDto
    type: object
    properties:
      additional_config:
        type: object
        allOf:
        - $ref: '#/definitions/CustomConfigAdditionalUpdateDto'
        - description: Other necessary configuration specific to the custom provider (currently configs for non-officially supported avalara based custom implementation)
      api_version:
        $ref: '#/definitions/CustomApiVersion'
      authentication:
        $ref: '#/definitions/CustomConfigAuthenticationDto'
      base_url:
        description: 'The base URL for the custom taxes RESTful API. The value should include the route prefix to the quotation API.

          * Required if the `api_version` is set to `v1`.

          * If the tax calculation strategy is set to `custom` and `api_version` is set to `v1`, the given configuration will be used.'
        example: https://my.custom.domain/base_path
        type: string
      exemption_classes:
        description: A list of supported exemption classes.
        type: array
        items:
          $ref: '#/definitions/ExemptionClassItemUpdateDto'
  CustomV0AvalaraConfigDto:
    title: CustomV0AvalaraConfigDto
    type: object
    properties:
      account_number:
        description: AvaTax account number or account ID.
        example: '2000123456'
        type: string
        minLength: 1
        maxLength: 10
      company_code:
        description: 'Company code that identifies the company in the AvaTax account.

          * Value is case-sensitive.

          * Declared during the company setup in the AvaTax Admin Console.'
        example: NEWSTOREINC
        type: string
        minLength: 1
        maxLength: 25
      license_key:
        description: AvaTax license key.
        example: C1234567890ABCFE
        type: string
        minLength: 1
        maxLength: 16
        format: password
      url:
        description: Custom provider RESTful API URL that uses AvaTax v1 schema. Will be used for tax calculations.
        example: https://custom.provider.net/1.0/tax/get
        type: string
    required:
    - account_number
    - company_code
    - license_key
    - url
  VertexConfigUpdateDto:
    title: VertexConfigUpdateDto
    type: object
    properties:
      administrative_origin:
        type: object
        allOf:
        - $ref: '#/definitions/VertexAdministrativeOriginUpdateDto'
        - description: Administrative origin information of the legal entity. Should be set based on the retailer corporate information.
          example:
            city: Berlin
            country: Germany
            currency_code: USD
            currency_value: 1.1
            main_division: Berlin
            postal_code: '10785'
            street_address_1: Potsdamer Str. 7
            street_address_2: Potsdamer Platz
      company_code:
        description: 'Vertex taxpayer code of the company.

          * Identifies the top-level legal entity (company).

          * The value should be set to the taxpayer code of the top-level taxpayer (company).'
        example: '1234'
        type: string
        minLength: 1
        maxLength: 40
      division_code:
        description: 'Vertex taxpayer code of the division.

          * Identifies the mid-level legal entity (division) under a top-level legal entity (company).

          * If exists, the value can be set to the taxpayer code of the mid-level taxpayer (division) under a top-level taxpayer (company).'
        example: '1234'
        type: string
        minLength: 1
        maxLength: 40
      exemption_classes:
        description: A list of mappings between `ExemptionClass` enum and Vertex class codes.
        type: array
        items:
          $ref: '#/definitions/VertexExemptionClassItemUpdateDto'
      flexible_fields:
        description: The mapping between extended attributes of items in the NewStore platform and flexible fields as defined in Vertex.
        example:
        - extended_attribute_name: productClass
          target_field_id: 1
          target_field_type: flexible_code_field
        - extended_attribute_name: shoeSize
          target_field_id: 1
          target_field_type: flexible_numeric_field
        type: array
        items:
          $ref: '#/definitions/VertexFlexibleFieldConfigUpdateDto'
      jurisdiction_in_tax_name_enabled:
        description: 'Enable appending the jurisdiction name to the tax line''s `tax_name` field.

          * This can help identify which jurisdiction imposed a given tax line.

          * Example: The tax name `Sales And Use Tax - Colorado` includes the jurisdiction name `Colorado` when the given flag is enabled.'
        example: true
        type: boolean
      login_type:
        $ref: '#/definitions/VertexAuthLoginType'
      password:
        description: 'Password of the Vertex account.

          * Required if `login_type` is set to `user_and_password`.'
        type: string
        minLength: 1
        maxLength: 255
        format: password
      soap_url:
        description: SOAP URL of the Vertex CalculateTax endpoint.
        example: https://sandboxap2.na1.ondemand.vertexinc.com/vertex-ws/services/CalculateTax90
        type: string
      trusted_id:
        description: 'Trusted ID of the Vertex account.

          * Required if `login_type` is set to `trusted_id`.'
        type: string
        minLength: 1
        maxLength: 255
        format: password
      use_location_code:
        description: 'Use Vertex location code instead of address information.

          * When this value is set to `true` the NewStore platform will use the Store IDs to communicate origin and destination addresses instead of using standard address information (address line 1, postal code, etc.).

          * Store IDs are currently only available for cash & carry orders, all other order scenarios will use the standard address information to communicate origin and destination addresses even with this value set to `true`.

          * In case the NewStore Store ID length is longer than 20 characters, NewStore will only send the first 20 characters as Vertex field length is capped at that limit.'
        example: true
        type: boolean
        default: false
      username:
        description: 'Username of the Vertex account.

          * Required if `login_type` is set to `user_and_password`.'
        type: string
        minLength: 1
        maxLength: 255
  ExemptionClass:
    title: ExemptionClass
    description: 'The tax exemption class that identifies the customer''s group/organization that accredited them with the tax exemption status.

      * For custom tax exemption classes, the `CUSTOM_` prefix with a UPPER_SNAKE_CASE key can be used. Example: `CUSTOM_CANADA`'
    example: CHARITY_ORGANIZATION
    type: string
    enum:
    - FEDERAL_GOVERNMENT
    - STATE_GOVERNMENT
    - TRIBAL_GOVERNMENT
    - LOCAL_GOVERNMENT
    - FOREIGN_DIPLOMAT
    - CHARITY_ORGANIZATION
    - RELIGIOUS_ORGANIZATION
    - EDUCATIONAL_ORGANIZATION
    - RESALE
    - DIRECT_PAY_PERMIT
    - OTHER
    - NON_RESIDENT
    - FIRST_NATION_CITIZEN
    - CUSTOM_*
  AvalaraExemptionClassItemCreateDto:
