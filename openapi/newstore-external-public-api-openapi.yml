  CashboxCreateV1Dto:
    title: CashboxCreateV1Dto
    type: object
    properties:
      config:
        description: Fiscal provider configuration.
      fiscal_provider_id:
        $ref: '#/definitions/FiscalProviderId'
    required:
    - config
    - fiscal_provider_id
  EnrichedTransactionItemDto:
    title: EnrichedTransactionItemDto
    type: object
    properties:
      consumer_uuid:
        description: UUID of the consumer.
        type: string
      currency_consumer:
        description: Currency code shown and billed to the consumer.
        example: USD
        type: string
      extended_attributes:
        description: The item's list of extended attributes.
        type: array
        items:
          $ref: '#/definitions/AddItemExtendedAttribute'
      handling_charges:
        description: Cost of handling.
        example: 10
        type: number
        format: double
      id:
        description: Unique identifier of the item.
        example: '123'
        type: string
      item_price:
        description: Price per quantity 1 of the item, can be incl. or excl. tax depending on tax_method.
        example: 200
        type: number
        format: double
      price_line_item:
        description: Gross price for the total quantity of the line item, after all discounts.
        example: 200
        type: number
        format: double
      price_net:
        description: Net price for total quantity of line item, after applying all discounts.
        example: 180
        type: number
        format: double
      price_tax:
        description: Total amount of tax added to the net price, after appplying all discounts.
        example: 20
        type: number
        format: double
      product_id:
        description: Unique identifier of the product.
        example: '123'
        type: string
      product_name:
        description: Human-readable name of the product.
        example: Metallica shirt
        type: string
        maxLength: 512
      product_sku:
        description: SKU of the product.
        example: AIk-0790
        type: string
        maxLength: 256
      quantity:
        description: Item quantity. Positive number for sold items and negative number for returned items
        example: 1
        type: integer
        format: int32
      shipping_address:
        type: object
        allOf:
        - $ref: '#/definitions/EnrichedTransactionAddressDto'
        - description: Consumer's shipping address.
      shipping_origin:
        type: object
        allOf:
        - $ref: '#/definitions/EnrichedTransactionAddressDto'
        - description: The origin of goods address, e.g. physical address of a store.
      tax_class:
        description: Tax classification identifier for the line item.
        example: AAA000
        type: string
        maxLength: 256
      tax_method:
        $ref: '#/definitions/SalesOrderTaxMethod'
      tax_rates:
        description: All applied tax percent values and tax amounts for total quantity of line item (usually more than one rate per line item).
        type: array
        items:
          $ref: '#/definitions/TaxRateDto'
      type:
        $ref: '#/definitions/ItemType'
    required:
    - item_price
    - price_line_item
    - price_net
    - price_tax
    - quantity
    - shipping_address
    - shipping_origin
    - tax_class
    - tax_method
    - tax_rates
    - type
  PostUsersRequest:
    title: PostUsersRequest
    type: object
    properties:
      email:
        description: Email address of the user.
        type: string
      external_directory:
        description: User is managed by an external directory.
        type: boolean
      first_name:
        description: First name of the user.
        type: string
      is_active:
        description: Whether the user can login or not.
        type: boolean
      last_name:
        description: Last name of the user.
        type: string
      phone:
        description: Telephone number of the user.
        type: string
      roles:
        description: List of role names the user is assigned to.
        type: array
        items:
          type: string
    required:
    - email
  SalesOrderCustomer:
    title: SalesOrderCustomer
    type: object
    properties:
      email:
        description: The email address of the customer.
        type: string
        minLength: 1
      id:
        description: The identifier of the customer.
        type: string
        minLength: 1
      language:
        description: The code of the language to be used in communicating with the customer in ISO 639-1 format, e.g. fr, de or en.
        type: string
        maxLength: 2
      name:
        description: The full name of the customer.
        type: string
        minLength: 1
  ReasonCodePatch:
    title: ReasonCodePatch
    example:
      name: defect
    type: object
    properties:
      name:
        description: The name of the reason code.
        type: string
    required:
    - name
  Application:
    title: Application
    description: Abbreviation of the application this permission belongs to.
    type: string
    enum:
    - nom
    - aa
    - mcp
  LimitExceededWhen:
    title: LimitExceededWhen
    type: object
    properties:
      order_amount_lt:
        description: AND order amount less than
        type: number
        minimum: 0.0
        format: double
      shipment_count_gt:
        description: 'AAAAACondition: number of shipments greater than'
        type: integer
        minimum: 0.0
        format: int64
    required:
    - order_amount_lt
    - shipment_count_gt
  Category:
    title: Category
    description: Describes if it is a Payment (authorization or capture) or Refund.
    type: string
    enum:
    - payment
    - refund
  RoleItem:
    title: RoleItem
    description: Needed for granting permissions per group not individually.
    type: object
    properties:
      id:
        description: Identifier of the role.
        type: string
      is_readonly:
        description: The role is read-only and not editable.
        type: boolean
      name:
        description: Name of the role.
        type: string
      updated_at:
        type: string
        format: date-time
    required:
    - id
    - name
  CustomConfigAuthenticationDto:
    title: CustomConfigAuthenticationDto
    type: object
    properties:
      method:
        $ref: '#/definitions/CustomConfigAuthenticationMethod'
      password:
        description: Custom provider Basic authentication password.
        example: secret-password
        type: string
      username:
        description: Custom provider Basic authentication username.
        example: username
        type: string
    required:
    - method
    - password
    - username
  VertexExemptionClassItemUpdateDto:
    title: VertexExemptionClassItemUpdateDto
    type: object
    properties:
      display_text:
        description: 'Display text to be used in Associate App while rendering the exemption class.

          * Required for custom tax exemption classes.

          * Optional for pre-defined tax exemption classes.

          * Keys must be a valid ISO 639-1 language code.

          * Must include English translation by default.'
        example:
          en: First Nation Citizen
          fr: Premières Nations
        type: object
        additionalProperties: {}
      exemption_class:
        $ref: '#/definitions/ExemptionClass'
      valid_countries:
        description: The list of countries where this tax exemption class is valid.
        type: array
        items:
          $ref: '#/definitions/TaxExemptionCountryCode'
      vertex_class_code:
        description: 'Vertex class code.

          * A code used to represent groups of customers, vendors, dispatchers, or recipients who have similar taxability.'
        example: '01'
        type: string
        minLength: 1
        maxLength: 20
    required:
    - exemption_class
    - valid_countries
    - vertex_class_code
  PackageDimensions:
    title: PackageDimensions
    description: The physical dimensions of a package type.
    type: object
    properties:
      height:
        description: Height of the package.
        type: number
        minimum: 0.0
        exclusiveMinimum: true
        format: double
      length:
        description: Length of the package.
        type: number
        minimum: 0.0
        exclusiveMinimum: true
        format: double
      unit:
        type: object
        allOf:
        - $ref: '#/definitions/dimension_unit'
        - description: Unit of measurement for the dimensions.
      width:
        description: Width of the package.
        type: number
        minimum: 0.0
        exclusiveMinimum: true
        format: double
    required:
    - height
    - length
    - unit
    - width
  F11nWarningCode:
    title: F11nWarningCode
    description: Fiscalization warning codes that are propagated to the clients (e.g. Associate App) for providing information on possible action items.
    example: f11n_fiscal_printer_paper_running_out
    type: string
    enum:
    - f11n_fiscal_printer_paper_running_out
    - f11n_fiscal_printer_charger_disconnected
    - f11n_fiscal_printer_fiscal_memory_nearly_full
  PostRolesRequest:
    title: PostRolesRequest
    description: Needed for granting permissions per group not individually.
    type: object
    properties:
      name:
        description: Name of the role. To be valid, it can't include slashes ('/').
        type: string
        pattern: ^[^/]+$
      permissions:
        description: List of permissions.
        type: array
        items:
          $ref: '#/definitions/Permission'
        minItems: 1
    required:
    - name
    - permissions
  CreateCartRequestBody:
    title: CreateCartRequestBody
    type: object
    properties:
      associate_id:
        description: Associate ID
        example: 0196f384-9d57-72bc-b2ed-bf489d65719d
        type: string
        minLength: 1
      catalog:
        description: Catalog name
        example: storefront-catalog-en
        type: string
        minLength: 1
      channel_id:
        description: Channel ID (e.g. the store ID)
        example: US_BOSTON_01
        type: string
        minLength: 1
      channel_type:
        description: Channel type
        type: string
        default: STORE
      currency:
        description: Currency
        example: USD
        type: string
        pattern: ^[a-zA-Z]{3}$
      customer_id:
        description: Customer ID
        example: 0196f384-9d57-7190-9e3e-89d5816f5805
        type: string
        minLength: 1
      device_id:
        description: Device ID
        example: 0196f384-9d57-72bc-b2ed-bf489d65719d
        type: string
        minLength: 1
      locale:
        description: Catalog locale
        example: en_US
        type: string
        minLength: 1
    required:
    - associate_id
    - catalog
    - channel_id
    - channel_type
    - currency
    - locale
  SalesOrderDiscount:
    title: SalesOrderDiscount
    type: object
    properties:
      coupon_code:
        description: The coupon code used for this discount.
        type: string
      level:
        type: object
        allOf:
        - $ref: '#/definitions/Level'
        - description: On which level the discount was applied, either on the entire order or only on this item.
      price_adjustment:
        description: The applied discount.
        type: number
        minimum: 0.0
        format: double
      promotion_uuid:
        description: The UUID of the the discount.
        type: string
      reason:
        description: The reason of the discount.
        type: string
      type:
        type: object
        allOf:
        - $ref: '#/definitions/Type1'
        - description: The type of the discount, either 'fixed' or 'percentage'.
      value:
        description: If the discount is of type 'fixed', this is equal to the adjusted price amount. If the discount is of type 'percentage', this is the percentage, e.g. 20%.
        type: number
        minimum: 0.0
        format: double
    required:
    - level
    - price_adjustment
    - type
    - value
