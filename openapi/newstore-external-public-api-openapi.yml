  InjectedOrderPayment:
    title: InjectedOrderPayment
    description: A payment supplied for this order. Only payments that are already authorized or captured are supported. Tokens that are not authorized are not supported. The validity of a payment is not checked during import, so an order with invalid payments is imported successfully and fulfilled. For example, a payment validity issue can be a voided authorization or an incorrect payment amount.
    type: object
    properties:
      amount:
        type: number
        minimum: 0.0
        exclusiveMinimum: true
        multipleOf: 0.01
        format: double
      correlation_ref:
        description: Identifies the payment for the given order among all payments. This identifier must be unique in the given order, regardless of the payment processor.
        type: string
        minLength: 1
        maxLength: 128
      metadata:
        description: Payment method specific information.
        type: object
        maxProperties: 100
      method:
        description: The selected payment method. Typical values are 'cash', 'credit_card', 'gift_card', or 'paypal'. Other values are possible depending on your payment providers.
        type: string
        minLength: 1
        maxLength: 64
      processed_at:
        description: Date representation of when the payment was processed, containing date, time and timezone as defined by https://tools.ietf.org/html/rfc3339 (ISO 8601).
        type: string
        format: date-time
      processor:
        description: Identifies the payment provider (processor) used to process the payment. Supported providers are stripe, paypal, cash, gift_card.
        type: string
        minLength: 1
        maxLength: 32
      type:
        type: object
        allOf:
        - $ref: '#/definitions/Type12'
        - description: 'The type of payment information that is passed: either the payment is already authorized, or already captured. The Order Injection API does not support not authorized payments (tokens).'
      wallet:
        description: The payment wallet used in the transaction. For example, Apple Pay, Google Pay, etc. or Direct (when no wallet was used).
        type: string
        minLength: 1
        maxLength: 64
    required:
    - amount
    - correlation_ref
    - method
    - processed_at
    - processor
    - type
  AvalaraConfigDto:
    title: AvalaraConfigDto
    type: object
    properties:
      account_number:
        description: AvaTax account number or account ID.
        example: '2000123456'
        type: string
        minLength: 1
        maxLength: 10
      company_code:
        description: 'Company code that identifies the company in the AvaTax account.

          * Value is case-sensitive.

          * Declared during the company setup in the AvaTax Admin Console.'
        example: NEWSTOREINC
        type: string
        minLength: 1
        maxLength: 25
      default_customer_code:
        description: Default customer code. Will be used in case when no ConsumerUUID is provided.
        example: Anonymous customer
        type: string
        minLength: 1
        maxLength: 50
      environment:
        $ref: '#/definitions/AvalaraEnv'
      exemption_classes:
        description: A list of mappings between `ExemptionClass` enum and Avalara custom entity use codes.
        type: array
        items:
          $ref: '#/definitions/AvalaraExemptionClassItemDto'
      license_key:
        description: AvaTax license key.
        example: C1234567890ABCFE
        type: string
        minLength: 1
        maxLength: 16
        format: password
    required:
    - account_number
    - company_code
    - environment
    - license_key
  InjectedOrderRequest:
    title: InjectedOrderRequest
    description: An order placed in an external system, identified by its `external_id` in NewStore. An order contains a list of shipments and the products in each shipment.
    type: object
    properties:
      associate_id:
        description: ID of the store associate who processed this order.
        type: string
        maxLength: 256
      billing_address:
        $ref: '#/definitions/InjectedOrderAddress'
      channel_name:
        description: A string used to distinguish between various sources of orders.
        type: string
        minLength: 1
        maxLength: 64
      channel_type:
        $ref: '#/definitions/ChannelType1'
      currency:
        type: object
        allOf:
        - $ref: '#/definitions/Currency2'
        - description: The currency for all the prices contained within this payload.
      customer_email:
        type: string
        minLength: 1
        maxLength: 64
      customer_language:
        description: Language code according to ISO 639-1 to be used in the communication with the consumer (e.g. 'de', 'en' or 'fr')
        type: string
        maxLength: 2
      customer_name:
        type: string
        minLength: 1
        maxLength: 128
      extended_attributes:
        type: array
        items:
          $ref: '#/definitions/InjectedOrderExtendedAttribute'
          maxProperties: 2
        maxItems: 100
        maxProperties: 2
      external_customer_id:
        type: string
        maxLength: 64
      external_id:
        type: string
        minLength: 1
        maxLength: 64
      ip_address: {}
      is_fulfilled:
        description: Set to true if the order was already fulfilled. It is either an in-store purchase, or the order was fulfilled by an external system.
        type: boolean
        default: false
      is_historical:
        description: Set to true if the order is historical was created and fulfilled by an external system.
        type: boolean
        default: false
      is_offline:
        description: Set to true if the order was handled offline. It is an in-store purchase with internet connection failure.
        type: boolean
        default: false
      is_preconfirmed:
        description: Set to true, if the customer was already notified about order being placed. This is always true for in-store orders.
        type: boolean
        default: false
      notification_blacklist:
        description: Excludes the specified notifications from being sent to the customer.
        type: array
        items:
          type: string
      payments:
        type: array
        items:
          $ref: '#/definitions/InjectedOrderPayment'
        maxItems: 40
      placed_at:
        description: Date representation of when the order was placed, containing date, time and timezone as defined by https://tools.ietf.org/html/rfc3339 (ISO 8601).
        type: string
        format: date-time
      price_method:
        type: object
        allOf:
        - $ref: '#/definitions/F11nTaxMethod'
        - description: Specifies if the prices for the shipment items and shipping options include tax or not. This is used in calculating the total order price to determine if the tax price should be included in the calculation or not.
      shipments:
        type: array
        items: {}
        minItems: 1
        maxItems: 10
      shipping_address:
        $ref: '#/definitions/InjectedOrderAddress'
      shop:
        description: The shop containing the items of the order.
        type: string
        minLength: 1
        maxLength: 128
      shop_locale:
        description: The locale of the customer used for the shop, in RFC 5646.
        type: string
        minLength: 1
        maxLength: 128
      store_id:
        description: ID of the store where this order was placed.
        type: string
        maxLength: 256
    required:
    - channel_name
    - channel_type
    - currency
    - external_id
    - shipments
    - shop
    - shop_locale
  CalculationMode:
    title: CalculationMode
    description: 'Type of the tax calculation


      * `STANDARD`: Standard tax calculation (default).

      * Taxes will be calculated for each line from `item_price * quantity` respecting the `tax_method` (tax incl./excl.).



      * `REVERSE`: Reverse calculation of taxes from the total amount paid by customer (e.g. for injected offline or e-comm orders).

      * Taxes will be calculated from `price_line_item` (total gross amount for given quantity) regardless of `tax_method` (tax incl./excl.).'
    example: STANDARD
    type: string
    enum:
    - STANDARD
    - REVERSE
  SalesOrderDetail:
    title: SalesOrderDetail
    type: object
    properties:
      addon_parent_item_id:
        description: Represents the ID of this addon item parent.
        type: string
      discounts:
        description: A list of applied discounts
        type: array
        items:
          $ref: '#/definitions/SalesOrderDiscount'
      extended_attributes:
        description: Extended attributes of the sales order item.
        type: array
        items:
          $ref: '#/definitions/SalesOrderExtendedAttribute'
          maxProperties: 2
        maxItems: 100
        maxProperties: 2
      external_identifier:
        type: object
        allOf:
        - $ref: '#/definitions/SalesOrderExternalIdentifier'
        - description: External identifier for the order item
      fulfillment_group_type:
        type: object
        allOf:
        - $ref: '#/definitions/Fulfillment'
        - description: The method by which the item was or will be fulfilled. This field is optional and is only populated when the capture path supplies it. For orders captured while the POS is offline (offline order sync), the value is null and the field is omitted from the response. To reliably identify cash-and-carry (in-store handover) orders, use the order-level `fulfillment_type` field (value `in_store_purchase`) rather than relying on this item-level field.
      id:
        description: Order item UUID
        type: string
      origin_id:
        description: If the origin of the order is 'newstore', this should be the order item identifier. If the order originated in an external system, it should be the identifier from the external system.
        type: string
        minLength: 1
      price:
        type: object
        allOf:
        - $ref: '#/definitions/SalesOrderPrice1'
        - description: The response for retrieving price information.
      price_catalog:
        description: The catalog price of the item.
        type: number
        format: double
      product_attributes:
        type: object
        allOf:
        - $ref: '#/definitions/SalesOrderProductAttributes'
        - description: Additional product-related information.
      product_id:
        description: Product ID for order item.
        type: string
      shipping_method:
        description: The shipping method, if applicable
        type: string
      status:
        type: object
        allOf:
        - $ref: '#/definitions/SalesOrderItemStatus'
        - description: Current status of the order item. 'pending' means the item is in the grace period, 'on_hold' means the item couldn't be fulfilled and is in a conflict status.
          minLength: 1
      tax_class:
        description: The tax classification code of the item.
        type: string
      tax_lines:
        description: Detailed tax information.
        type: array
        items:
          $ref: '#/definitions/SalesOrderTaxLine'
        maxItems: 100
    required:
    - id
    - origin_id
    - price
    - product_attributes
    - status
  FallbackErrorDto:
