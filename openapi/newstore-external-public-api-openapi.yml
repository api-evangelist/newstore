        type: object
        allOf:
        - $ref: '#/definitions/ProviderRateShippingType'
        - description: Required for backwards compatibility purposes.
      use_as_customer_facing_cost:
        description: Flag to indicate if the shipping provider cost is used instead of the service level cost defined in the fulfillment configuration. If set to true, the cost quoted by the shipping provider is displayed to the customer.
        type: boolean
    required:
    - carrier_defined_service_level
