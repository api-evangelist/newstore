        example:
        - month-report
        - year-report
        type: array
        items:
          $ref: '#/definitions/PeriodType'
        maxItems: 5
      timezone:
        $ref: '#/definitions/Timezone'
    required:
    - auto_report_types
    - report_types
    - timezone
  RoutingInsightsStrategyType:
