    type: object
    properties:
      name:
        description: Name of the role. To be valid, it can't include slashes ('/').
        type: string
        pattern: ^[^/]+$
      permissions:
        description: List of permissions.
        type: array
        items:
          $ref: '#/definitions/Permission'
        minItems: 1
    required:
    - name
    - permissions
  StoreConfigV1Dto:
    title: StoreConfigV1Dto
    type: object
