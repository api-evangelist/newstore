  SalesOrder:
    title: SalesOrder
    type: object
    properties:
      catalog:
        description: The catalog identifier (shop) associated with the order.
        type: string
      channel_type:
        type: object
        allOf:
        - $ref: '#/definitions/SalesOrderChannelType'
        - description: The channel through which the order was placed.
      currency:
        description: Currency code (ISO 4217) used in internal accounting
        type: string
        minLength: 3
        maxLength: 3
      fulfillment_type:
        type: object
        allOf:
        - $ref: '#/definitions/SalesOrderFulfillmentType'
        - description: The fulfillment type of the order. In case of mixed cart orders, fulfillment type is always 'multiple'
          minLength: 1
      id:
        description: External ID of the order
        type: string
      items:
        description: A list of line items which were ordered
        type: array
        items:
          $ref: '#/definitions/SalesOrderItem'
      origin:
        type: object
        allOf:
        - $ref: '#/definitions/SalesOrderOrigin'
        - description: Describes in which Order Management System the order originated from.
      origin_id:
        description: The identifier of the order from the Order Management System where it originated from. If it originated in Newstore, it must be the identifier assigned to the order during the order creation process.
        type: string
        minLength: 1
      placed_at:
        description: The time when the order was placed. It should follow https://tools.ietf.org/html/rfc3339 in UTC.
        type: string
        format: date-time
      status:
        type: object
        allOf:
        - $ref: '#/definitions/SalesOrderStatus'
        - description: Current status of the sales order
    required:
    - channel_type
    - currency
    - fulfillment_type
    - id
    - items
    - origin
    - origin_id
    - placed_at
    - status
  RequestContext:
    title: RequestContext
    description: The HTTP request that carried the audited change.
    type: object
    properties:
