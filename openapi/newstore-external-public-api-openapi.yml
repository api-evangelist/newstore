    type: object
    properties:
      billing_address:
        type: object
        allOf:
        - $ref: '#/definitions/SalesOrderAddress'
        - description: Address
      catalog:
        description: The catalog identifier (shop) associated with the order.
        type: string
      channel_type:
        type: object
        allOf:
        - $ref: '#/definitions/SalesOrderChannelType'
        - description: The channel through which the order was placed.
      currency:
        description: Currency code (ISO 4217) used in internal accounting
        type: string
        minLength: 3
        maxLength: 3
      customer:
        $ref: '#/definitions/SalesOrderCustomer'
      exemption_class:
        description: The tax exemption class for the order (e.g. CHARITY_ORGANIZATION). Only present when the order carries a tax exemption.
        type: string
      exemption_number:
        description: The tax exemption certificate number for the order. Only present when the order carries a tax exemption.
        type: string
      extended_attributes:
        description: Extended attributes of the sales order item.
        type: array
        items:
          $ref: '#/definitions/SalesOrderExtendedAttribute'
        maxItems: 100
      fulfillment_type:
        type: object
        allOf:
        - $ref: '#/definitions/SalesOrderFulfillmentType'
        - description: The fulfillment type of the order. In case of mixed cart orders, fulfillment type is always 'multiple'
          minLength: 1
      fulfillments:
        description: Fulfillment groups for the order. Each group references its order items and carries the ship-from origin for those items.
        type: array
        items:
          $ref: '#/definitions/SalesOrderFulfillment'
      gift_wrapping:
        type: object
        allOf:
        - $ref: '#/definitions/SalesOrderGiftWrapping'
        - description: Gift wrapping information. This field is not required and will not be present if gift wrapping is not applicable for the order
      id:
        description: External ID of an order
        type: string
      is_offline:
        description: Set to true if sales order item was created in offline mode.
        type: boolean
      items:
        description: Contains a list of order items
        type: array
        items:
          $ref: '#/definitions/SalesOrderDetail'
      notification_blacklist:
        description: Excludes the specified notifications from being sent to the customer.
        type: array
        items:
          type: string
      origin:
        type: object
        allOf:
        - $ref: '#/definitions/SalesOrderOrigin'
        - description: Describes in which Order Management System the order originated from.
      origin_id:
        description: The identifier of the order from the Order Management System where it originated from. If it originated in Newstore, it is the system-generated UUID assigned to the order during the order creation process. If it originated in an external OMS, it is the human-readable identifier.
        type: string
        minLength: 1
      payment_history:
        description: 'Note: This field will be empty if a NewStore internal order is requested. This field is only set when the order is fetched from an external source.'
        type: array
        items:
          $ref: '#/definitions/SalesOrderItemPaymentHistory'
      placed_at:
        description: The time when the order was placed. It should follow https://tools.ietf.org/html/rfc3339 in UTC.
        type: string
        format: date-time
      shipments:
        type: array
        items:
          $ref: '#/definitions/SalesOrderItemShipment'
      shipping_address:
        type: object
        allOf:
        - $ref: '#/definitions/SalesOrderAddress'
        - description: Address
      shop_locale:
        description: The locale used for the shop, in RFC 5646.
        type: string
      status:
        type: object
        allOf:
        - $ref: '#/definitions/SalesOrderStatus'
        - description: Current status of the sales order
      store_id:
        description: The store id where the order was placed.
        type: string
        minLength: 1
      tax_exempt:
        description: If the tax was exempted for this order. In case of external orders, the flag will always return false.
        type: boolean
      tax_method:
        type: object
        allOf:
        - $ref: '#/definitions/SalesOrderTaxMethod'
        - description: Method of calculation of the taxes, can be vat_included or vat_excluded.
      totals:
        $ref: '#/definitions/SalesOrderTotals'
    required:
    - channel_type
    - currency
    - fulfillment_type
    - id
    - items
    - origin
    - origin_id
    - placed_at
    - status
    - totals
  VertexConfigUpdateDto:
    title: VertexConfigUpdateDto
    type: object
    properties:
      administrative_origin:
        type: object
        allOf:
        - $ref: '#/definitions/VertexAdministrativeOriginUpdateDto'
        - description: Administrative origin information of the legal entity. Should be set based on the retailer corporate information.
          example:
            city: Berlin
            country: Germany
            currency_code: USD
            currency_value: 1.1
            main_division: Berlin
            postal_code: '10785'
            street_address_1: Potsdamer Str. 7
            street_address_2: Potsdamer Platz
      company_code:
        description: 'Vertex taxpayer code of the company.

          * Identifies the top-level legal entity (company).

          * The value should be set to the taxpayer code of the top-level taxpayer (company).'
        example: '1234'
        type: string
        minLength: 1
        maxLength: 40
      division_code:
        description: 'Vertex taxpayer code of the division.

          * Identifies the mid-level legal entity (division) under a top-level legal entity (company).

          * If exists, the value can be set to the taxpayer code of the mid-level taxpayer (division) under a top-level taxpayer (company).'
        example: '1234'
        type: string
        minLength: 1
        maxLength: 40
      exemption_classes:
        description: A list of mappings between `ExemptionClass` enum and Vertex class codes.
        type: array
        items:
          $ref: '#/definitions/VertexExemptionClassItemUpdateDto'
      flexible_fields:
        description: The mapping between extended attributes of items in the NewStore platform and flexible fields as defined in Vertex.
        example:
        - extended_attribute_name: productClass
          target_field_id: 1
          target_field_type: flexible_code_field
        - extended_attribute_name: shoeSize
          target_field_id: 1
          target_field_type: flexible_numeric_field
        type: array
        items:
          $ref: '#/definitions/VertexFlexibleFieldConfigUpdateDto'
      jurisdiction_in_tax_name_enabled:
        description: 'Enable appending the jurisdiction name to the tax line''s `tax_name` field.

          * This can help identify which jurisdiction imposed a given tax line.

          * Example: The tax name `Sales And Use Tax - Colorado` includes the jurisdiction name `Colorado` when the given flag is enabled.'
        example: true
        type: boolean
      login_type:
        $ref: '#/definitions/VertexAuthLoginType'
      password:
        description: 'Password of the Vertex account.

          * Required if `login_type` is set to `user_and_password`.'
        type: string
        minLength: 1
        maxLength: 255
        format: password
      soap_url:
        description: SOAP URL of the Vertex CalculateTax endpoint.
        example: https://sandboxap2.na1.ondemand.vertexinc.com/vertex-ws/services/CalculateTax90
        type: string
      trusted_id:
        description: 'Trusted ID of the Vertex account.

          * Required if `login_type` is set to `trusted_id`.'
        type: string
        minLength: 1
        maxLength: 255
        format: password
      use_location_code:
        description: 'Use Vertex location code instead of address information.

          * When this value is set to `true` the NewStore platform will use the Store IDs to communicate origin and destination addresses instead of using standard address information (address line 1, postal code, etc.).

          * Store IDs are currently only available for cash & carry orders, all other order scenarios will use the standard address information to communicate origin and destination addresses even with this value set to `true`.

          * In case the NewStore Store ID length is longer than 20 characters, NewStore will only send the first 20 characters as Vertex field length is capped at that limit.'
        example: true
        type: boolean
        default: false
      username:
        description: 'Username of the Vertex account.

          * Required if `login_type` is set to `user_and_password`.'
        type: string
        minLength: 1
        maxLength: 255
  CustomV0AvalaraConfigCreateDto:
