            * Required if the `api_version` is set to `v0-avalara`.

            * If the tax calculation strategy is set to `custom` and `api_version` is set to `v0-avalara`, the given configuration will be used.'
          example:
            account_number: '2000123456'
            company_code: NEWSTOREINC
            license_key: C1234567890ABCFE
            url: https://custom.provider.net/1.0/tax/get
  FiscalMode:
    title: FiscalMode
    description: 'Fiscal mode.

      * Defaults to `standard` if not provided.'
    example: standard
    type: string
    enum:
    - standard
    - offline
  F11nTransactionType:
    title: F11nTransactionType
    description: Transaction type.
    example: sale
    type: string
    enum:
    - sale
    - return
    - exchange
    - cancellation
    - void
    - create_void
    - foreign_sale
    - foreign_return
    - foreign_exchange
    - foreign_cancellation
    - create_x_report
    - create_z_report
    - manual_create_report
    - document_printed
    - document_emailed
    - cash_drawer_transaction
  AvalaraExemptionClassItemUpdateDto:
    title: AvalaraExemptionClassItemUpdateDto
    type: object
    properties:
      avalara_entity_use_code:
        description: 'Avalara entity use code.

          * For pre-defined tax exemption classes, value must correspond to the Avalara entity use code. For the possible options, please refer to the [List of entity use codes](https://knowledge.avalara.com/bundle/hff1682048150115_hff1682048150115/page/List_of_entity_use_codes.html).

          * For custom tax exemption classes, value must correspond to the custom entity use code defined under the exempt entity custom tax rule.'
        example: CANADA_FNC
        type: string
        minLength: 1
        maxLength: 25
      display_text:
        description: 'Display text to be used in Associate App while rendering the exemption class.

          * Required for custom tax exemption classes.

          * Optional for pre-defined tax exemption classes.

          * Keys must be a valid ISO 639-1 language code.

          * Must include English translation by default.'
        example:
          en: First Nation Citizen
          fr: Premières Nations
        type: object
        additionalProperties: {}
      exemption_class:
        $ref: '#/definitions/ExemptionClass'
      valid_countries:
        description: The list of countries where this tax exemption class is valid.
        type: array
        items:
          $ref: '#/definitions/TaxExemptionCountryCode'
    required:
    - avalara_entity_use_code
    - exemption_class
    - valid_countries
  OrderInjectionTenantConfiguration:
    title: OrderInjectionTenantConfiguration
    description: Tenant configuration object.
    type: object
    properties:
      big_sales_order:
        type: object
        allOf:
        - $ref: '#/definitions/OrderInjectionConfigurationBigSalesOrder'
        - description: The order item limits that determine if the order is routed or is considered a big order and placed on hold.
      skip_soft_routing_on_injection:
        description: When set to true, do not do the soft routing for injected orders with a service level identifier.
        type: boolean
  CreateIdentityProviderRequest:
    title: CreateIdentityProviderRequest
    description: Create an Identity Provider
    type: object
    properties:
      config: {}
      enabled:
        type: boolean
        default: true
      protocol:
        type: object
        allOf:
        - $ref: '#/definitions/IdentityProviderProtocol'
        - description: Supported Protocols for Identity Providers
      vendor:
        type: object
        allOf:
        - $ref: '#/definitions/IdentityProviderVendor'
        - description: Supported Vendors for Identity Providers
    required:
    - config
    - protocol
    - vendor
  OrderInjectionConfigurationBigSalesOrder:
    title: OrderInjectionConfigurationBigSalesOrder
    description: The order item limits that determine if the order is routed or is considered a big order and placed on hold.
    type: object
    properties:
      hard_limit_for_big_orders:
        description: The maximum number of items an injected or external order can contain for it to be placed on hold and not be canceled. For example, if this is ``800`` and ``soft_limit_for_big_orders`` is ``300``, external orders with items between ``301`` and ``800`` are placed on hold, and an external order with ``801`` items is canceled.
        type: number
        format: double
    required:
    - hard_limit_for_big_orders
  VertexExemptionClassItemDto:
    title: VertexExemptionClassItemDto
    type: object
    properties:
      display_text:
        description: 'Display text to be used in Associate App while rendering the exemption class.

          * Required for custom tax exemption classes.

          * Optional for pre-defined tax exemption classes.

          * Keys must be a valid ISO 639-1 language code.

          * Must include English translation by default.'
        example:
          en: First Nation Citizen
          fr: Premières Nations
        type: object
        additionalProperties: {}
      exemption_class:
        $ref: '#/definitions/ExemptionClass'
      valid_countries:
        description: The list of countries where this tax exemption class is valid.
        type: array
        items:
          $ref: '#/definitions/TaxExemptionCountryCode'
      vertex_class_code:
        description: 'Vertex class code.

          * A code used to represent groups of customers, vendors, dispatchers, or recipients who have similar taxability.'
        example: '01'
        type: string
        minLength: 1
        maxLength: 20
    required:
    - exemption_class
    - valid_countries
    - vertex_class_code
  OptedIn:
    title: OptedIn
    description: Opt-in status information for a conversation between a customer and a store.
    example:
      opt_in_state: accepted
      opt_in_state_modified_at: '2025-01-03T18:03:00Z'
    type: object
    properties:
      opt_in_state:
        type: object
        allOf:
        - $ref: '#/definitions/OptInState'
        - description: The current opt-in state for this store.
      opt_in_state_modified_at:
        description: Timestamp when the opt-in state was last modified.
        type: string
        format: date-time
    required:
    - opt_in_state
    - opt_in_state_modified_at
  RoutingStatus:
    title: RoutingStatus
    type: string
    enum:
    - open
    - processed
    - cancelled
    - conflict
    - dispatched
    - ready_for_routing
    - ready_for_rerouting
    - rerouting_initiated
    - voided
    - recalculating_shipments
    - swapped
  CreatePackageTypeRequest:
    title: CreatePackageTypeRequest
    description: 'Request body for creating a new package type. Package types define the packages

      available for an associate to choose from during the packing flow in the Associate App.'
    example:
      dimensions:
        height: 385
        length: 70
        unit: mm
        width: 260
      name: Small Padded Satchel
      weight:
        amount: 20
        unit: g
    type: object
    properties:
      dimensions:
        type: object
        allOf:
        - $ref: '#/definitions/PackageDimensions'
        - description: The physical dimensions of a package type.
      name:
        description: Display name shown to associates when selecting a package.
        type: string
      weight:
        type: object
        allOf:
        - $ref: '#/definitions/PackageWeight'
        - description: The weight of a package type.
    required:
    - dimensions
    - name
    - weight
  PutRolesByIdRequest:
    title: PutRolesByIdRequest
