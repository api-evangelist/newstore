openapi: 3.2.0
info:
  version: '1.0'
  title: NewStore Package Types API
  description: NewStore public APIs
  contact:
    email: support@newstore.com
    name: NewStore API Support
    url: https://developer.newstore.com
servers:
- url: https://dodici-demo.p.newstore.net/
security: []
tags:
- name: Package Types
  description: Package Types
  externalDocs:
    url: https://docs.newstore.com/
    description: 'Package types allow associates to select which type of package they have packed items into during the packing flow in the Associate App. If no package types are configured, the step to select a package type will be skipped.


      The dimensions and weight of the selected package will be sent to the shipping adapter when booking the shipment, via the `package_option` field. See the [Shipping Provider Webhook docs](https://docs.newstore.net/api/webhooks/delivery_hook#tag/Shipments/operation/book-shipment) for more information.'
paths:
  /fulfillment/package-types:
    get:
      description: '🚧 BETA: This endpoint is in beta and may change.


        See API Lifecycle Documentation for details.


        Returns all configured package types sorted by alphabetical order. These define the packages available for an associate to choose from during the packing flow in the Associate App.'
      summary: listPackageTypes
      tags:
      - Package Types
      operationId: listPackageTypes
      deprecated: false
      responses:
        default:
          description: Default Response
          headers: {}
        '200':
          description: Successful Response
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageTypesResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PackageTypesResponse'
        '400':
          description: Bad Request
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too Many Requests
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: Bad Gateway
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - oauth: []
    post:
      description: '🚧 BETA: This endpoint is in beta and may change.


        See API Lifecycle Documentation for details.


        Creates a new package type for the tenant. Once created, the package type will be available for associates to select during the packing flow in alphabetical order in the Associate App. Returns a 201 with the new package type''s ID in the Location header.'
      summary: createPackageType
      tags:
      - Package Types
      operationId: createPackageType
      deprecated: false
      parameters:
      - name: Content-Type
        in: header
        required: false
        description: ''
        schema:
          type: string
          enum:
          - application/json
      responses:
        default:
          description: Default Response
          headers: {}
        '201':
          description: Successful Response
          headers: {}
          content:
            application/json:
              schema: {}
            application/problem+json:
              schema: {}
        '400':
          description: Bad Request
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too Many Requests
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: Bad Gateway
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - oauth: []
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePackageTypeRequest'
        required: true
  /fulfillment/package-types/{package_type_id}:
    delete:
      description: '🚧 BETA: This endpoint is in beta and may change.


        See API Lifecycle Documentation for details.


        Deletes an existing package type. Once deleted, the package type will no longer be available for associates to select during the packing flow in the Associate App. Package types are available in alphabetical order when listed.'
      summary: destroyPackageType
      tags:
      - Package Types
      operationId: destroyPackageType
      deprecated: false
      parameters:
      - name: package_type_id
        in: path
        required: true
        description: ''
        schema:
          type: string
          format: uuid
      responses:
        default:
          description: Default Response
          headers: {}
        '204':
          description: Successful Response
          headers: {}
        '404':
          description: Package type not found.
          headers: {}
        '429':
          description: Too Many Requests
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal Server Error
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: Bad Gateway
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - oauth: []
    get:
      description: '🚧 BETA: This endpoint is in beta and may change.


        See API Lifecycle Documentation for details.


        Returns a single package type by its ID. Package types are available in alphabetical order when listed.'
      summary: showPackageType
      tags:
      - Package Types
      operationId: showPackageType
      deprecated: false
      parameters:
      - name: package_type_id
        in: path
        required: true
        description: ''
        schema:
          type: string
          format: uuid
      responses:
        default:
          description: Default Response
          headers: {}
        '200':
          description: Successful Response
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageTypeResponse'
            application/problem+json:
