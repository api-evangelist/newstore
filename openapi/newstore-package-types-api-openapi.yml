    patch:
      description: '🚧 BETA: This endpoint is in beta and may change.


        See API Lifecycle Documentation for details.


        Partially updates an existing package type. Only the provided fields will be updated; omitted fields remain unchanged. Package types are available in alphabetical order when listed.'
      summary: updatePackageType
      tags:
      - Package Types
      operationId: updatePackageType
      deprecated: false
      parameters:
      - name: package_type_id
        in: path
        required: true
        description: ''
        schema:
          type: string
          format: uuid
      - name: Content-Type
        in: header
        required: false
        description: ''
        schema:
          type: string
          enum:
          - application/json
      responses:
        default:
          description: Default Response
          headers: {}
        '200':
          description: Successful Response
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PackageTypeResponse'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/PackageTypeResponse'
        '400':
          description: Bad Request
          headers: {}
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: Package type not found.
