paths:
  /promotions/reason-codes:
    get:
      description: Retrieves reason codes per locale
      summary: listReasonCodes
      tags:
      - Reason Codes
      operationId: listReasonCodes
      deprecated: false
      parameters:
      - name: Accept-Language
        in: header
        required: false
        description: The locale of reason codes. if not present all codes from all locales are returned.
        schema:
          type: string
      - name: feature
        in: query
        required: false
        description: Indicates the feature of the reason code.
        schema:
          type: string
          enum:
          - DISCOUNT
          - OVERRIDE
          default: DISCOUNT
      responses:
        default:
          description: Error response
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '200':
          description: Retrieves reason codes per locale
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ListResponse'
            application/json:
              schema:
                $ref: '#/components/schemas/ListResponse'
        '400':
          description: Locale does not match regex
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized request
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden request
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: When no reason codes exist for the tenant or for the given locale
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too Many Requests
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal server error
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: Bad Gateway
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
            application/json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - oauth:
        - promotions:reason-codes:read
    post:
      description: Creates a new reason code
      summary: createReasonCode
      tags:
      - Reason Codes
      operationId: createReasonCode
      deprecated: false
      parameters:
      - name: Content-Type
        in: header
        required: false
        description: ''
        schema:
          type: string
          enum:
          - application/json
      - name: Accept-Language
        in: header
        required: false
        description: The locale that the reasons codes belong to.
        schema:
          type: string
          default: en-US
      - name: feature
        in: query
        required: false
        description: Indicates the feature of the reason code.
        schema:
          type: string
          enum:
          - DISCOUNT
          - OVERRIDE
          default: DISCOUNT
      responses:
        default:
          description: Error response
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '201':
          description: Reason code was created
          headers: {}
        '400':
          description: Bad request
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: Unauthorized request
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: Forbidden request
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '409':
          description: Reason code already exist
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '429':
          description: Too Many Requests
          headers:
            Retry-After:
              schema:
                type: string
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          description: Internal server error
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '502':
          description: Bad Gateway
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '503':
          description: Service Unavailable
          headers: {}
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
      security:
      - oauth:
        - promotions:reason-codes:write
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReasonCodeInit'
        required: true
